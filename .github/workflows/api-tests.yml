name: API Automation Tests

on:
  push:
    branches: [main]
    paths:
      - 'api-automation/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
      - 'api-automation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-automation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run API test suite
        run: npm test

      - name: Upload Playwright API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-html-report
          path: api-automation/playwright-report/
          retention-days: 14
